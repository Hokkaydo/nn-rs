[workspace]
resolver = "3"
members = ["nn-autograd","nn-la", "nn-gpu", "nn-core"]

[package]
name = "nn-rs"
version = "0.1.0"
edition = "2024"
authors = ["Hokkaydo"]

[dependencies]
nn-la = { path = "nn-la" }
nn-autograd = { path = "nn-autograd" }
nn-gpu = { path = "nn-gpu" }
nn-core = { path = "nn-core" }

[[bin]]
name = "bench_runner"
path = "src/bench_runner.rs"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "matmul"
harness = false

[[bench]]
name = "elemwise"
harness = false

[[bench]]
name = "forward"
harness = false

[[bench]]
name = "backward"
harness = false